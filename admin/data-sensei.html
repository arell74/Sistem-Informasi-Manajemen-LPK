<!DOCTYPE html>
<html lang="id" data-role="admin" data-page="data-sensei" data-title="Data Sensei">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Data Sensei · Admin · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Data Sensei</h2><p class="muted">Pengajar bahasa dan budaya di LPK Yuuki.</p></div>
          <button class="btn" id="btnTambah"><span data-icon="plus"></span> Tambah Sensei</button>
        </div>

        <section class="grid cards" id="senseiGrid"></section>

        <div class="modal" id="modalSensei" hidden>
          <form class="modal-box" id="formSensei" novalidate>
            <div class="modal-head"><h3 id="judulModal">Tambah Sensei</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
            <div class="modal-body">
              <input type="hidden" name="id">
              <div class="form-grid">
                <div class="field full"><label for="t_nama">Nama lengkap</label><input class="input" id="t_nama" name="nama" required minlength="3" data-msg="Minimal 3 karakter."></div>
                <div class="field"><label for="t_asal">Asal</label><select class="select" id="t_asal" name="asal"><option>Jepang</option><option>Indonesia</option></select></div>
                <div class="field"><label for="t_status">Status</label><select class="select" id="t_status" name="status"><option>Aktif</option><option>Cuti</option><option>Nonaktif</option></select></div>
                <div class="field full"><label for="t_spes">Spesialisasi</label><input class="input" id="t_spes" name="spesialisasi" required placeholder="Contoh: Kanji & Kosakata"></div>
                <div class="field"><label for="t_telepon">Telepon</label><input class="input" id="t_telepon" name="telepon" required pattern="[0-9+\- ]{9,16}" data-msg="Nomor telepon tidak valid."></div>
                <div class="field"><label for="t_email">Email</label><input class="input" type="email" id="t_email" name="email" required></div>
              </div>
            </div>
            <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="submit" class="btn">Simpan</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin/data-sensei.js"></script>
</body>
</html>
