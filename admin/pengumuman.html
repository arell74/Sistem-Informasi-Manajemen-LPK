<!DOCTYPE html>
<html lang="id" data-role="admin" data-page="pengumuman" data-title="Pengumuman">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Pengumuman · Admin · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/admin.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Pengumuman</h2><p class="muted">Kirim informasi ke seluruh siswa, sensei, atau kelas tertentu.</p></div>
        </div>

        <section class="grid cols-2-1">
          <article class="card">
            <div class="card-head"><h3>Riwayat Pengumuman</h3><span class="muted text-sm" id="jumlah"></span></div>
            <div id="daftar"></div>
          </article>

          <article class="card">
            <div class="card-head"><h3>Buat Pengumuman</h3></div>
            <form id="formPengumuman" novalidate>
              <div class="field"><label for="judul">Judul</label><input class="input" id="judul" name="judul" required minlength="5" data-msg="Minimal 5 karakter."></div>
              <div class="field"><label for="target">Tujuan</label><select class="select" id="target" name="target"></select></div>
              <div class="field"><label for="isi">Isi pengumuman</label><textarea class="textarea" id="isi" name="isi" required minlength="10" data-msg="Minimal 10 karakter."></textarea></div>
              <button class="btn btn-block" type="submit"><span data-icon="megaphone"></span> Kirim Pengumuman</button>
            </form>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/admin/pengumuman.js"></script>
</body>
</html>
