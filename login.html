<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="img/icon-192.png">
  <title>Masuk — Yuuki Portal</title>
  <link rel="icon" href="img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/public.css">
</head>
<body class="login">
  <div class="login-wrap">

    <aside class="login-art">
      <a href="index.html" class="logo" aria-label="Yuuki Portal"><img class="logo-img" src="img/logo-white.svg" alt="LPK Yuuki Training Center Indonesia" height="42"><span class="portal-badge">Portal</span></a>
      <div>
        <h2>Satu portal untuk belajar, mengajar, dan mengelola.</h2>
        <p>Masuk sesuai peranmu: Admin, Sensei, atau Siswa. Setiap peran melihat menu dan data yang berbeda.</p>
      </div>
      <span class="kanji">送り出し機関 勇気研修センターインドネシア</span>
    </aside>

    <main class="login-form">
      <div class="login-card">
        <h1>Selamat datang</h1>
        <p class="muted">Pilih peran lalu masuk dengan akun kamu.</p>

        <div id="notice"></div>

        <div class="role-tabs" role="tablist" aria-label="Pilih peran">
          <button type="button" class="role-tab active" role="tab" data-role="admin"  style="--tab:#DC1F28"><span data-icon="dashboard"></span>Admin</button>
          <button type="button" class="role-tab" role="tab" data-role="sensei" style="--tab:#2563EB"><span data-icon="book"></span>Sensei</button>
          <button type="button" class="role-tab" role="tab" data-role="siswa"  style="--tab:#0D9488"><span data-icon="grad"></span>Siswa</button>
        </div>

        <form id="formLogin" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="email" required autocomplete="username" placeholder="nama@yuuki.test">
          </div>
          <div class="field">
            <label for="password">Kata sandi</label>
            <div class="pass">
              <input class="input" type="password" id="password" name="password" required minlength="4" autocomplete="current-password" placeholder="••••••••">
              <button type="button" id="lihat" aria-label="Tampilkan kata sandi" data-icon="eye"></button>
            </div>
          </div>
          <button class="btn btn-lg btn-block" type="submit" id="btnMasuk">Masuk sebagai Admin</button>
        </form>

        <div class="demo">
          <b>Akun users</b> — <span id="demoInfo"></span><br>
          <button type="button" id="isiDemo">Isi otomatis</button>
        </div>

        <a href="index.html" class="back-link">← Kembali ke beranda</a>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
