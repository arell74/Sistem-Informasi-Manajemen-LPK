<!DOCTYPE html>
<html lang="id" data-role="pimpinan" data-page="persetujuan" data-title="Persetujuan Direktur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Persetujuan & Disposisi · Direktur · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/pimpinan.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div>
            <h2>Pusat Persetujuan & Disposisi (Approval)</h2>
            <p class="muted">Otorisasi pimpinan atas kelayakan keberangkatan siswa, pengesahan rapor evaluasi, dan kerjasama mitra.</p>
          </div>
        </div>

        <section class="grid stats" id="statsApproval"></section>

        <div class="card">
          <div class="toolbar">
            <div class="search">
              <span data-icon="search"></span>
              <input class="input" type="search" placeholder="Cari permohonan…" aria-label="Cari approval" data-search="#tblApproval">
            </div>
            <select class="select" aria-label="Filter status" data-filter="#tblApproval" data-col="4">
              <option value="">Semua status</option>
              <option>Menunggu</option>
              <option>Disetujui</option>
              <option>Ditolak</option>
            </select>
          </div>

          <div class="table-wrap">
            <table class="table" id="tblApproval">
              <thead>
                <tr>
                  <th>No. Berkas</th>
                  <th>Jenis Pengajuan</th>
                  <th>Peserta / Terkait</th>
                  <th>Uraian & Pemohon</th>
                  <th>Status</th>
                  <th style="text-align:right">Tindakan</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/pimpinan/persetujuan.js"></script>
</body>
</html>
