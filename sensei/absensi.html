<!DOCTYPE html>
<html lang="id" data-role="sensei" data-page="absensi" data-title="Absensi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Absensi · Sensei · Yuuki Portal</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/sensei.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Absensi Siswa</h2><p class="muted">Catat kehadiran siswa untuk setiap pertemuan.</p></div>
        </div>

        <div class="card">
          <div class="toolbar">
            <select class="select" id="pilihKelas" aria-label="Pilih kelas"></select>
            <input class="input" type="date" id="tanggal" aria-label="Tanggal pertemuan" style="width:auto">
            <button class="btn btn-ghost" id="semuaHadir"><span data-icon="check"></span> Tandai semua hadir</button>
            <button class="btn" id="simpan" style="margin-left:auto"><span data-icon="checksq"></span> Simpan Absensi</button>
          </div>

          <div class="summary" id="ringkas" aria-live="polite"></div>

          <div class="table-wrap">
            <table class="table" id="tblAbsen">
              <thead><tr><th>No</th><th>Nama siswa</th><th>Kehadiran</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sensei/absensi.js"></script>
</body>
</html>
