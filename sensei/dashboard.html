<!DOCTYPE html>
<html lang="id" data-role="sensei" data-page="dashboard" data-title="Dashboard Sensei">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Dashboard Sensei · Sensei · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/sensei.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="welcome">
          <div>
            <h2>Ohayou gozaimasu, <span id="namaSensei">Sensei</span>-sensei!</h2>
            <p id="sapaan">Semoga kelas hari ini berjalan lancar.</p>
          </div>
          <button class="btn btn-light" data-open="#modalUmum"><span data-icon="megaphone"></span> Kirim Pengumuman ke Kelas</button>
        </div>

        <section class="grid stats" id="stats"></section>

        <section class="grid cols-2-1">
          <article class="card">
            <div class="card-head"><h3>Jadwal Mengajar Hari Ini</h3><span class="badge badge-info" id="hariIni"></span></div>
            <div id="jadwalHariIni"></div>
          </article>
          <article class="card">
            <div class="card-head"><h3>Pengumuman</h3></div>
            <div id="pengumuman"></div>
          </article>
        </section>

        <article class="card">
          <div class="card-head"><h3>Progres Belajar per Kelas</h3><a href="kelas-saya.html" class="btn btn-ghost btn-sm">Kelas saya</a></div>
          <div id="progresKelas"></div>
        </article>

        <!-- Modal pengumuman ke kelas -->
        <div class="modal" id="modalUmum" hidden>
          <form class="modal-box" id="formUmum" novalidate>
            <div class="modal-head"><h3>Pengumuman ke Kelas</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
            <div class="modal-body">
              <div class="field"><label for="u_kelas">Kelas tujuan</label><select class="select" id="u_kelas" name="target" required></select></div>
              <div class="field"><label for="u_judul">Judul</label><input class="input" id="u_judul" name="judul" required minlength="5" data-msg="Minimal 5 karakter."></div>
              <div class="field"><label for="u_isi">Isi pengumuman</label><textarea class="textarea" id="u_isi" name="isi" required minlength="10" data-msg="Minimal 10 karakter."></textarea></div>
            </div>
            <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="submit" class="btn">Kirim</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sensei/dashboard.js"></script>
</body>
</html>
