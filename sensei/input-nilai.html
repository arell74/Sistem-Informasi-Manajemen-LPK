<!DOCTYPE html>
<html lang="id" data-role="sensei" data-page="input-nilai" data-title="Input Nilai">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Input Nilai · Sensei · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/sensei.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Input Nilai</h2><p class="muted">Isi nilai 0–100. Rata-rata dan predikat dihitung otomatis.</p></div>
        </div>

        <div class="card">
          <div class="toolbar">
            <select class="select" id="pilihKelas" aria-label="Pilih kelas"></select>
            <div class="search"><span data-icon="search"></span><input class="input" type="search" placeholder="Cari nama siswa…" aria-label="Cari siswa" data-search="#tblNilai"></div>
            <button class="btn" id="simpan"><span data-icon="check"></span> Simpan Nilai</button>
          </div>
          <div class="table-wrap">
            <table class="table" id="tblNilai">
              <thead><tr><th>Nama siswa</th><th>Kosakata</th><th>Kanji</th><th>Tata Bahasa</th><th>Listening</th><th>Kaiwa</th><th>Rata-rata</th><th>Predikat</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
          <p class="muted text-sm mt">Predikat: A ≥ 85 · B ≥ 75 · C ≥ 65 · D &lt; 65. Nilai kosong dihitung 0.</p>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sensei/input-nilai.js"></script>
</body>
</html>
