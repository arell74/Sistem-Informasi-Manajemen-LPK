<!DOCTYPE html>
<html lang="id" data-role="sensei" data-page="kelas-saya" data-title="Kelas Saya">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Kelas Saya · Sensei · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/sensei.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Kelas Saya</h2><p class="muted">Kelas yang kamu ampu beserta daftar siswanya.</p></div>
        </div>

        <section class="grid cards" id="kelasGrid"></section>

        <!-- Modal daftar siswa -->
        <div class="modal" id="modalSiswa" hidden>
          <div class="modal-box">
            <div class="modal-head"><h3 id="judulKelas">Daftar Siswa</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
            <div class="modal-body">
              <div class="table-wrap">
                <table class="table" id="tblSiswa">
                  <thead><tr><th>ID</th><th>Nama</th><th>Progres</th><th>Rata-rata</th><th>Status</th></tr></thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Tutup</button></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sensei/kelas-saya.js"></script>
</body>
</html>
