<!DOCTYPE html>
<html lang="id" data-role="sensei" data-page="materi" data-title="Materi Pembelajaran">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi Pembelajaran · Sensei · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/sensei.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Materi Pembelajaran</h2><p class="muted">Unggah materi agar bisa diunduh siswa di kelasnya.</p></div>
        </div>

        <section class="grid cols-2-1">
          <article class="card">
            <div class="card-head"><h3>Materi yang Saya Unggah</h3><span class="muted text-sm" id="jumlah"></span></div>
            <div class="toolbar">
              <div class="search"><span data-icon="search"></span><input class="input" type="search" placeholder="Cari judul materi…" aria-label="Cari materi" data-search="#tblMateri"></div>
            </div>
            <div class="table-wrap">
              <table class="table" id="tblMateri">
                <thead><tr><th>Judul</th><th>Kelas</th><th>Jenis</th><th>Ukuran</th><th>Tanggal</th><th></th></tr></thead>
                <tbody></tbody>
              </table>
            </div>
          </article>

          <article class="card">
            <div class="card-head"><h3>Unggah Materi Baru</h3></div>
            <form id="formMateri" novalidate>
              <div class="field"><label for="judul">Judul materi</label><input class="input" id="judul" name="judul" required minlength="5" data-msg="Minimal 5 karakter."></div>
              <div class="field"><label for="kelas">Untuk kelas</label><select class="select" id="kelas" name="kelas" required></select></div>
              <div class="field"><label for="jenis">Jenis</label><select class="select" id="jenis" name="jenis"><option>PDF</option><option>Slide</option><option>Audio</option><option>Video</option></select></div>
              <div class="field"><label for="berkas">Berkas</label><input class="input" type="file" id="berkas" name="berkas" required accept=".pdf,.ppt,.pptx,.mp3,.mp4,.doc,.docx"><span class="hint">Maksimal 20 MB. Hanya nama & ukuran file yang disimpan (simulasi).</span></div>
              <button class="btn btn-block" type="submit"><span data-icon="upload"></span> Unggah</button>
            </form>
          </article>
        </section>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/sensei/materi.js"></script>
</body>
</html>
