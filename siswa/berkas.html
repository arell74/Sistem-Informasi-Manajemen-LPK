<!DOCTYPE html>
<html lang="id" data-role="siswa" data-page="berkas" data-title="Berkas Keberangkatan">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Berkas Keberangkatan · Siswa · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/siswa.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Berkas Keberangkatan</h2><p class="muted">Unggah dokumen yang diperlukan. Admin akan memverifikasinya.</p></div>
        </div>

        <article class="card" style="margin-bottom:1.1rem">
          <div class="card-head"><h3>Kelengkapan Berkas</h3><b id="persen"></b></div>
          <div class="progress ok" style="height:12px"><i id="bar" style="--v:0%"></i></div>
          <p class="muted text-sm mt" id="ket" style="margin-bottom:0"></p>
        </article>

        <section class="grid cards" id="docGrid"></section>
        <input type="file" id="pilihFile" accept=".jpg,.jpeg,.png,.pdf" hidden>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/siswa/berkas.js"></script>
</body>
</html>
