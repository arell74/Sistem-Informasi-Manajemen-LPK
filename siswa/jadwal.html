<!DOCTYPE html>
<html lang="id" data-role="siswa" data-page="jadwal" data-title="Jadwal Belajar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jadwal Belajar · Siswa · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/siswa.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Jadwal Belajar</h2><p class="muted" id="sub">Jadwal mingguan kelasmu.</p></div>
          <button class="btn btn-ghost" onclick="window.print()"><span data-icon="printer"></span> Cetak</button>
        </div>

        <div class="card"><div class="week" id="week"></div></div>

        <article class="card mt">
          <div class="card-head"><h3>Daftar Pertemuan</h3></div>
          <div class="table-wrap">
            <table class="table" id="tblJadwal">
              <thead><tr><th>Hari</th><th>Jam</th><th>Mata pelajaran</th><th>Kelas</th><th>Sensei</th><th>Ruang</th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </article>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/siswa/jadwal.js"></script>
</body>
</html>
