<!DOCTYPE html>
<html lang="id" data-role="siswa" data-page="materi" data-title="Materi Belajar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi Belajar · Siswa · Yuuki Portal</title>
  <link rel="icon" href="../img/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/siswa.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Materi Belajar</h2><p class="muted">Materi dari sensei untuk kelasmu. Klik unduh untuk menyimpan.</p></div>
        </div>

        <div class="card">
          <div class="toolbar">
            <div class="search"><span data-icon="search"></span><input class="input" type="search" placeholder="Cari judul materi…" aria-label="Cari materi" data-search="#tblMateri"></div>
            <select class="select" aria-label="Filter jenis" data-filter="#tblMateri" data-col="2">
              <option value="">Semua jenis</option><option>PDF</option><option>Slide</option><option>Audio</option><option>Video</option>
            </select>
          </div>
          <div class="table-wrap">
            <table class="table" id="tblMateri">
              <thead><tr><th>Judul</th><th>Kelas</th><th>Jenis</th><th>Ukuran</th><th>Diunggah</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/siswa/materi.js"></script>
</body>
</html>
