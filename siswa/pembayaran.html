<!DOCTYPE html>
<html lang="id" data-role="siswa" data-page="pembayaran" data-title="Pembayaran Saya">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- PWA & Mobile Capabilities -->
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#C8102E">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Yuuki Portal">
  <link rel="apple-touch-icon" href="../img/icon-192.png">
  <title>Pembayaran Saya · Siswa · Yuuki Portal</title>
  <link rel="icon" href="../img/logo-mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/siswa.css">
  <!-- penjaga hak akses: dijalankan sebelum halaman tampil -->
  <script src="../js/guard.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head">
          <div><h2>Pembayaran Saya</h2><p class="muted">Status tagihan dan riwayat pembayaran biaya program.</p></div>
        </div>

        <section class="grid stats" id="stats"></section>

        <article class="card" style="margin-bottom:1.1rem">
          <div class="card-head"><h3>Progres Pelunasan</h3><b id="persen"></b></div>
          <div class="progress ok" style="height:12px"><i id="barBayar" style="--v:0%"></i></div>
        </article>

        <article class="card">
          <div class="card-head"><h3>Rincian Tagihan</h3></div>
          <div class="table-wrap">
            <table class="table" id="tblBayar">
              <thead><tr><th>Invoice</th><th>Keterangan</th><th class="num">Jumlah</th><th>Tanggal / Jatuh tempo</th><th>Status</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>
        </article>

        <!-- Modal unggah bukti -->
        <div class="modal" id="modalBukti" hidden>
          <form class="modal-box sm" id="formBukti" novalidate>
            <div class="modal-head"><h3>Unggah Bukti Pembayaran</h3><button type="button" class="icon-btn" data-close aria-label="Tutup" data-icon="x"></button></div>
            <div class="modal-body">
              <p class="muted" id="buktiInfo"></p>
              <div class="field"><label for="metode">Metode pembayaran</label>
                <select class="select" id="metode" name="metode" required><option value="">Pilih…</option><option>Transfer BCA</option><option>Transfer Mandiri</option><option>Transfer BRI</option><option>Tunai di kantor</option></select></div>
              <div class="field"><label for="bukti">Bukti transfer</label><input class="input" type="file" id="bukti" name="bukti" required accept=".jpg,.jpeg,.png,.pdf"><span class="hint">JPG, PNG, atau PDF. Maksimal 2 MB.</span></div>
            </div>
            <div class="modal-foot"><button type="button" class="btn btn-ghost" data-close>Batal</button><button type="submit" class="btn">Kirim Bukti</button></div>
          </form>
        </div>
      </main>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/siswa/pembayaran.js"></script>
</body>
</html>
